  <circle cx="128" cy="28" r="3" fill="#E1C98E"/>
  <circle cx="228" cy="128" r="3" fill="#E1C98E"/>
  <circle cx="128" cy="228" r="3" fill="#E1C98E"/>
  <circle cx="28" cy="128" r="3" fill="#E1C98E"/>
