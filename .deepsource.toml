version = 1

exclude_patterns = [
  # CommonJS build guard; the repository-wide analyzer is configured for ESM.
  "scripts/verify-deployment-platform.cjs",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  module_system = "es-modules"
  dialect = "typescript"
  environment = ["nodejs", "vitest"]
  plugins = ["react"]

[[analyzers]]
name = "sql"
enabled = true
