services:
  - type: web
    name: academiaarcana
    runtime: node
    branch: main
    # Deploy on every commit that reaches main. Main only ever receives merged
    # pull requests, so the Quality Gate has already run before the promotion
    # starts. checksPass cannot be used here: it withholds the deploy while any
    # check on the commit is red, and the Production Smoke check can only turn
    # green after this service is already serving the new revision. That is a
    # circular dependency, not a gate. See
    # docs/engineering/2026-10-23-render-promotion-deadlock.md.
    autoDeployTrigger: commit
    buildCommand: node scripts/verify-dependency-lifecycle-scripts.cjs && npm ci --ignore-scripts && npm rebuild esbuild unrs-resolver --ignore-scripts=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NPM_CONFIG_IGNORE_SCRIPTS
        value: "true"
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://academiaarcana.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.6-sol
      - key: NEXT_PUBLIC_ADOBE_FONTS_KIT_ID
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_ASSETS_URL
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_REVISION
        sync: false
      - key: MESTRE_ARCANO_WEB_RESEARCH_PROVIDER
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: PARALLEL_API_BASE_URL
        value: https://api.parallel.ai
      - key: EXA_API_KEY
        sync: false
