services:
  - type: web
    name: academiaarcana
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: node scripts/verify-dependency-lifecycle-scripts.cjs && npm ci --strict-allow-scripts=true && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.6-sol
      - key: NEXT_PUBLIC_HONEYBADGER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_ASSETS_URL
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_REVISION
        sync: false
      - key: MESTRE_ARCANO_WEB_RESEARCH_PROVIDER
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: PARALLEL_API_BASE_URL
        value: https://api.parallel.ai
      - key: EXA_API_KEY
        sync: false
