services:
  - type: web
    name: academiaarcana
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://fichnalpbcfjywwhixid.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
