services:
  - type: web
    name: academiaarcana
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.6-sol
      - key: NEXT_PUBLIC_HONEYBADGER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_ASSETS_URL
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_REVISION
        sync: false
