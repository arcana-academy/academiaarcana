name: C99 targeted accessible multimedia contracts
on:
  push:
    branches:
      - work/aa360-c99-media-contracts-proof-20261023
permissions:
  contents: read
jobs:
  c99:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Two new C99 multimedia contract tests only
        run: npm exec -- vitest run src/components/workspace/C99MediaContracts.test.tsx
      - name: Lint only changed C99 TypeScript
        run: npm exec -- eslint src/components/workspace/PageEditor.tsx src/components/workspace/AccessiblePageReadingPreview.tsx src/components/workspace/AccessiblePageTextExport.tsx src/components/workspace/C99MediaContracts.test.tsx
      - name: Exact C99 source typecheck
        run: npm run typecheck
