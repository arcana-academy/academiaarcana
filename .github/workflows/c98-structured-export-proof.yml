name: C98 isolated structured grimoire export proof
on:
  push:
    branches:
      - work/aa360-c98-structured-export-proof-20261023
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Only C98 structured export tests
        run: npm exec -- vitest run src/components/workspace/AccessiblePageStructuredExport.test.tsx
      - name: Lint only C98 affected TypeScript
        run: npm exec -- eslint src/components/workspace/AccessiblePageStructuredExport.tsx src/components/workspace/AccessiblePageStructuredExport.test.tsx src/components/workspace/PageEditor.tsx
      - name: C98 exact source typecheck
        run: npm run typecheck
