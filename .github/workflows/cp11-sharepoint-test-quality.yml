name: CP11 SharePoint Authorization Test Quality
on:
  push:
    branches:
      - test/cp11-sharepoint-ownership-quality-20261011

permissions:
  contents: read

concurrency:
  group: cp11-sharepoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout SHA in isolated runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pin PR598 and CP10 ancestor, no sensitive environment
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 63f21d5a9e2af40e8fee5852c752ca14761eae75 HEAD
          git merge-base --is-ancestor ac5f9f993aa14f9b6893795f27ea0c82dd99f7b2 HEAD
          git fetch --no-tags origin refs/pull/598/head
          test "$(git ls-remote origin refs/pull/598/head | cut -f1)" = "63f21d5a9e2af40e8fee5852c752ca14761eae75"
          for name in DATABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_PASSWORD SUPABASE_ACCESS_TOKEN MICROSOFT_CLIENT_SECRET MICROSOFT_GRAPH_ACCESS_TOKEN RENDER_API_KEY; do
            if [[ -n "${!name:-}" ]]; then echo "::error::Sensitive CP11 runtime credential present"; exit 1; fi
          done
          node scripts/verify-supply-chain-workflows.cjs
          echo "CP11_EXACT_SHA=$(git rev-parse HEAD)"
      - name: Install test dependencies
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci --ignore-scripts
          npm rebuild unrs-resolver --ignore-scripts=false
      - name: Typecheck changed synthetic tests
        run: npm run typecheck
      - name: Run only newly changed SharePoint authorization tests
        run: |
          npm exec -- vitest run \
            src/app/api/integrations/microsoft-sharepoint/cp10-route-isolation.test.ts \
            src/infrastructure/integrations/microsoft-sharepoint-cp11-ownership.test.ts
      - name: Confirm no database, provider or deployment action
        if: always()
        run: |
          echo "CP11: unit tests and planning document only, no remote DB, tenant, migrations or deploy."
          git status --short
