name: Academia Arcana P1 Logout Isolated Proof

on:
  push:
    branches:
      - 'feat/p1-logout-ci-proof'
    paths:
      - 'src/lib/auth/**'
      - 'src/infrastructure/supabase/**'
      - 'src/components/layout/**'
      - 'scripts/security/test-p1-logout-remote-first.mjs'
      - 'tests/e2e/p1-logout-local.spec.ts'
      - '.github/workflows/p1-logout-isolated.yml'

permissions:
  contents: read

concurrency:
  group: p1-logout-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-auth-proof:
    name: Disposable local Auth and Browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild reviewed native packages
        run: npm rebuild esbuild unrs-resolver --ignore-scripts=false

      - name: Start disposable Supabase
        run: supabase start

      - name: Configure app with local-only Auth
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          const lines = execFileSync('supabase', ['status', '-o', 'env'], { encoding: 'utf8' }).split(/\r?\n/)
          const get = (name) => {
            const line = lines.find(line => line.startsWith(name + '='))
            if (!line) throw new Error('Missing local ' + name)
            return line.slice(name.length + 1).replace(/^["']|["']$/g, '')
          }
          const url = new URL(get('API_URL'))
          if (url.protocol !== 'http:' || !['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) throw new Error('Hosted Auth refused')
          appendFileSync(process.env.GITHUB_ENV, 'NEXT_PUBLIC_SUPABASE_URL=' + url.toString() + '\n')
          appendFileSync(process.env.GITHUB_ENV, 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' + get('ANON_KEY') + '\n')
          appendFileSync(process.env.GITHUB_ENV, 'P1_LOCAL_AUTH_E2E=1\n')
          NODE

      - name: A1 A2 B revocation, RLS and JWT residual proof
        run: node scripts/security/test-p1-logout-remote-first.mjs

      - name: Build app against disposable local Supabase
        run: npm run build

      - name: Install Playwright
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify actual browser global logout and SSR cookies
        run: npm exec -- playwright test tests/e2e/p1-logout-local.spec.ts

      - name: Destroy disposable Supabase
        if: always()
        run: supabase stop --no-backup
