name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.19.1 --activate

      - name: Verify dependency lifecycle allowlist
        run: node scripts/verify-dependency-lifecycle-scripts.cjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: npm rebuild unrs-resolver --ignore-scripts=false

      - run: npm run lint -- --fix

      # Visual baselines depend on the CI Chromium build, so they can only be
      # regenerated here. This runs exclusively for pull requests a maintainer
      # labelled `refresh-visual-baselines`; autofix.ci commits the refreshed
      # manifests onto the pull-request branch for normal review.
      - name: Install Playwright browser for baseline refresh
        if: contains(github.event.pull_request.labels.*.name, 'refresh-visual-baselines')
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Refresh visual baselines
        if: contains(github.event.pull_request.labels.*.name, 'refresh-visual-baselines')
        env:
          AA_VISUAL_BASELINES_WRITE: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
        run: |
          npm run build
          npm run test:e2e -- \
            design-system-visual \
            proof-surfaces \
            focus-production-pilot \
            cronograma-production-pilot \
            statistics-production-pilot

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
