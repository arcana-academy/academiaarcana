name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts

      - name: Verify dependency lifecycle allowlist
        run: node scripts/verify-dependency-lifecycle-scripts.cjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: npm rebuild esbuild unrs-resolver --ignore-scripts=false

      - run: npm run lint -- --fix

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
