name: Temporary npm audit diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  npm-audit-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Collect audit
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_exit=$?
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          console.log("AUDIT_EXIT=" + process.exitCode);
          console.log("SUMMARY=" + JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(data.vulnerabilities ?? {})) {
            if (["high", "critical"].includes(item.severity)) {
              console.log("VULNERABILITY=" + JSON.stringify({
                name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                nodes: item.nodes,
                via: item.via,
                fixAvailable: item.fixAvailable
              }));
            }
          }
          NODE
          echo "NPM_AUDIT_EXIT=$audit_exit"
          exit 0
