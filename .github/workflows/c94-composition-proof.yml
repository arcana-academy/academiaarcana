name: C94 isolated six-PR composition proof
on:
  push:
    branches:
      - work/aa360-c94-composition-proof-20261023
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Only new C94 cross-component interactions
        run: npm exec -- vitest run src/components/workspace/C94Composition.test.tsx
      - name: Lint changed integration components
        run: npm exec -- eslint src/app/fonts.ts src/app/layout.tsx src/components/accessibility/AccessibilityPanel.tsx src/components/workspace/PagePaperStyleView.tsx src/components/workspace/PageFrameStyleView.tsx src/components/workspace/PageEditor.tsx src/components/workspace/Workspace.tsx src/components/workspace/C94Composition.test.tsx
      - name: Check composed TypeScript tree
        run: npm run typecheck
