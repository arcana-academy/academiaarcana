name: C97 focused local accessible TXT export
on:
  push:
    branches:
      - work/aa360-c97-txt-export-proof-20261023
permissions:
  contents: read
jobs:
  txt-export:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: New C97 text-export tests only
        run: npm exec -- vitest run src/components/workspace/AccessiblePageTextExport.test.tsx
      - name: C97 affected TypeScript lint only
        run: npm exec -- eslint src/components/workspace/AccessiblePageReadingPreview.tsx src/components/workspace/AccessiblePageTextExport.tsx src/components/workspace/AccessiblePageTextExport.test.tsx src/components/workspace/PageEditor.tsx
      - name: C97 exact-source typecheck
        run: npm run typecheck
