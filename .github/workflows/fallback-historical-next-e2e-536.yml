name: Academia Arcana P0 536 Historical Next.js Browser E2E

on:
  push:
    branches:
      - chore/536-fallback-validation-20261009

permissions:
  contents: read

concurrency:
  group: p0-536-historical-next-e2e-${{ github.sha }}
  cancel-in-progress: true

jobs:
  nextjs-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout review-only test controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Checkout immutable historical LIVE application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 17fb81477fbd3eed14b93103641004a766eb9ac1
          path: historical
          persist-credentials: false

      - name: Check immutable provenance and copy only untracked E2E harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical rev-parse HEAD)" = "17fb81477fbd3eed14b93103641004a766eb9ac1"
          test "$(find historical/supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "24"
          test ! -f historical/scripts/security/test-local-nextjs-browser-536.mjs
          test ! -f historical/.env.local
          test ! -f historical/.env.production.local
          cp validation/scripts/security/test-local-nextjs-browser-536.mjs historical/scripts/security/
          cmp validation/scripts/security/test-local-nextjs-browser-536.mjs historical/scripts/security/test-local-nextjs-browser-536.mjs
          test -z "$(git -C historical diff --name-only)"
          echo "Immutable LIVE sources; sandbox E2E harness untracked overlay only"

      - name: Setup pinned Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install version-locked historical dependencies safely
        working-directory: historical
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-dependency-lifecycle-scripts.cjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild unrs-resolver --ignore-scripts=false

      - name: Install isolated Chromium browser
        working-directory: historical
        run: npx playwright install --with-deps chromium

      - name: Assert no hosted Supabase credentials or URLs
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY OPENAI_API_KEY; do
            if printenv "$name" >/dev/null; then
              echo "::error::Forbidden externally configured variable: $name"
              exit 1
            fi
          done
          echo "Only dynamic disposable local API and ANON_KEY will be used."

      - name: Start full disposable historical Supabase
        working-directory: historical
        run: supabase start

      - name: Test historical Next.js browser E2E against local Supabase only
        working-directory: historical
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: node scripts/security/test-local-nextjs-browser-536.mjs

      - name: Stop and discard disposable local Supabase
        if: always()
        working-directory: historical
        run: supabase stop --no-backup
