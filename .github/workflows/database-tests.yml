name: Academia Arcana Database Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  database:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Start local Supabase
        run: supabase db start

      - name: Apply local migrations
        run: supabase migration up --local --include-all

      - name: Run gamification database tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/gamification_atomic.test.sql

      - name: Run workspace page movement database tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/move_workspace_page_test.sql

      - name: Run focus and social privilege database tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/focus_social_privileges.test.sql

      - name: Run P0 authorization and RLS behavior tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/authorization_rls_p0.test.sql

      - name: Run isolated teacher-class authorization contract tests (Ciclo 16)
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/teacher_class_contract_c16.test.sql

      - name: Run Feedback Hub database privilege tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/feedback_hub_privileges.test.sql

      - name: Test Feedback deletion cascade only in disposable local database
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/feedback_fk_cascade_p0.test.sql

      - name: Run integration credential security tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/integration_credentials_security.test.sql

      - name: Run external document source privilege tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/external_document_sources_privileges.test.sql

      - name: Run P1 educational core database tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/educational_core_p1_privileges.test.sql

      - name: Run P1 educational core RLS and atomicity tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/educational_core_p1_rls.test.sql

      - name: Run P1.5 objective evidence privilege tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/educational_objective_evidence_p15_privileges.test.sql

      - name: Run P1.5 objective evidence RLS and RPC tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/educational_objective_evidence_p15_rls.test.sql

      - name: Run durable AI rate-limit privileges and account-isolation tests
        run: |
          log_file="$RUNNER_TEMP/ai-rate-limit-pgtap.log"
          set +e
          supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/open_source_ai_rate_limits.test.sql >"$log_file" 2>&1
          result=$?
          set -e
          cat "$log_file"
          if [ "$result" -ne 0 ]; then
            node --input-type=module - "$log_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const lines = readFileSync(process.argv[2], "utf8").split(/\r?\n/);
          const relevant = lines.filter((line) => /not ok|fail|error|exception|syntax|constraint|expected|looks like/i.test(line)).slice(-20);
          const details = relevant.length ? relevant : ["Rate-limit pgTAP failed; consult this job's step log."];
          for (const line of details) {
            const escaped = line.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log(`::error title=Rate-limit local database test::${escaped}`);
          }
          NODE
          fi
          exit "$result"

      - name: Run private grimoire-cover Storage RLS tests
        run: supabase test db --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" supabase/tests/database/grimoire_covers_storage_rls.test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
