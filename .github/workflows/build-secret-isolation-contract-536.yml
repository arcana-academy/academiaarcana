name: Academia Arcana P0 536 Build Secret Isolation Contract

on:
  pull_request:
    branches:
      - integration/p0-536-release-train-20261009
      - main
    paths:
      - .dockerignore
      - Dockerfile
      - Dockerfile.dockerignore
      - scripts/security/test-docker-build-context-536.test.cjs
      - scripts/security/verify-docker-synthetic-layers-536.mjs
      - .github/workflows/build-secret-isolation-contract-536.yml
      - .github/workflows/fallback-validation-536.yml
      - scripts/security/assert-build-secret-isolation-536.cjs
      - scripts/security/test-build-secret-isolation-536.test.cjs
      - render.yaml
      - package.json
      - docs/deployment/build-secret-isolation-536.md

permissions:
  contents: read

jobs:
  negative-build-secret-canaries:
    name: Fail-closed build boundary (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse foreign repository PR sources
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
      - name: Checkout exact PR source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm checked out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Execute isolated build credential negative cases
        env:
          CI: "true"
        run: node --test scripts/security/test-build-secret-isolation-536.test.cjs scripts/security/test-docker-build-context-536.test.cjs
      - name: Inspect disposable synthetic Docker image history and layers
        timeout-minutes: 5
        run: node scripts/security/verify-docker-synthetic-layers-536.mjs
