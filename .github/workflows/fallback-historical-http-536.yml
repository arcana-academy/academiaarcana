name: Academia Arcana P0 536 Isolated HTTP Auth RLS Storage

on:
  push:
    branches:
      - chore/536-fallback-validation-20261009

permissions:
  contents: read

concurrency:
  group: p0-536-http-${{ github.sha }}
  cancel-in-progress: true

jobs:
  isolated-http:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout immutable validation controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Checkout exact historical LIVE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 17fb81477fbd3eed14b93103641004a766eb9ac1
          path: historical
          persist-credentials: false

      - name: Verify immutable source and copy only sandbox test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical rev-parse HEAD)" = "17fb81477fbd3eed14b93103641004a766eb9ac1"
          test -f validation/scripts/security/test-local-http-auth-storage-536.mjs
          test "$(find historical/supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "24"
          test ! -f historical/scripts/security/test-local-http-auth-storage-536.mjs
          cp validation/scripts/security/test-local-http-auth-storage-536.mjs historical/scripts/security/
          cmp validation/scripts/security/test-local-http-auth-storage-536.mjs historical/scripts/security/test-local-http-auth-storage-536.mjs
          test -z "$(git -C historical diff --name-only)"
          echo "Only new, untracked sandbox test overlaid onto historical last-LIVE source"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install only historical locked dependencies
        working-directory: historical
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify no hosted environment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          echo "No remote Supabase project variables or credentials were supplied"

      - name: Start full disposable historical Supabase stack
        working-directory: historical
        run: supabase start

      - name: Exercise real local HTTP Auth, cookies, PostgREST and private Storage
        working-directory: historical
        run: node scripts/security/test-local-http-auth-storage-536.mjs

      - name: Stop and discard disposable local Supabase
        if: always()
        working-directory: historical
        run: supabase stop --no-backup
