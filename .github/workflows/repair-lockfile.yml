name: Repair package lockfile

on:
  push:
    branches:
      - feat/percy-visual-testing

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/repair-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
            exit 0
          fi
          git commit -m "fix: regenerate package lockfile"
          git push
