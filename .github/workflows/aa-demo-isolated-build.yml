name: Academia Arcana Isolated MVP Build (No Backend)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: isolated-mvp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-build:
    name: Isolated demo - no Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCANA_DEMO_ISOLATED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.19.1 --activate

      - name: Confirm isolated prebuild has no Supabase or database
        run: node scripts/verify-public-runtime-config.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild approved native dependencies
        run: npm rebuild unrs-resolver --ignore-scripts=false

      - name: Build isolated application without backend credentials
        run: npm run build
