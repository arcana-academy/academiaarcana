name: Workspace Production E2E Validation

on:
  push:
    branches:
      - 'test/workspace-production-e2e-*'

permissions:
  contents: read

jobs:
  validate:
    name: Workspace Production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://academiaarcana.onrender.com
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts

      - name: Verify dedicated E2E credentials are configured
        shell: bash
        run: |
          test -n "$E2E_EMAIL" || { echo "E2E_EMAIL is not configured."; exit 1; }
          test -n "$E2E_PASSWORD" || { echo "E2E_PASSWORD is not configured."; exit 1; }

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: npm rebuild esbuild unrs-resolver --ignore-scripts=false

      - name: Install Playwright browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate Workspace in production
        run: npm exec -- playwright test tests/e2e/workspace-production.spec.ts --config=playwright.production.config.ts

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-production-e2e-evidence
          path: |
            test-results/workspace-production/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
