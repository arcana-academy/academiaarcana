name: C106 isolated approved visual contracts and browser
on:
  push:
    branches:
      - work/aa360-c106-contract-browser-proof-20261023
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 06c27056c120fc735ea43d4bc5260648703bba81
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Targeted auth settings mobile and existing shell regressions
        run: npm exec -- vitest run src/components/auth/AuthForm.test.tsx src/app/configuracoes/page.c106.test.tsx src/components/layout/SanctuaryMobileDock.test.tsx src/components/layout/AuthenticatedShell.test.tsx
      - name: Lint only changed TSX
        run: npm exec -- eslint src/components/auth/AuthForm.tsx src/components/auth/AuthForm.test.tsx src/app/configuracoes/page.tsx src/app/configuracoes/page.c106.test.tsx src/components/layout/AuthenticatedShell.tsx src/components/layout/SanctuaryMobileDock.tsx src/components/layout/SanctuaryMobileDock.test.tsx
      - name: Typecheck delta
        run: npm run typecheck
      - name: CSS syntax C106
        run: node -e "const fs=require('node:fs'); const postcss=require('postcss'); const p='src/app/arcana-visual-approved.css';const root=postcss.parse(fs.readFileSync(p,'utf8'),{from:p});console.log(root.nodes.length,'root CSS nodes');"
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 6
      - name: Verify product branch untouched
        run: git merge-base --is-ancestor 06c27056c120fc735ea43d4bc5260648703bba81 HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - run: npm exec -- playwright install chromium
      - name: Start local-only Next.js for synthetic proof
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAAAAAAAAAAAAAA_BBBBBBBB
          APP_ENV: test
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3106 > /tmp/c106-next.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS --max-time 4 http://127.0.0.1:3106/cadastro >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 100 /tmp/c106-next.log
          exit 1
      - name: Desktop and mobile Chromium (synthetic for private screens)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAAAAAAAAAAAAAA_BBBBBBBB
          APP_ENV: test
        run: npm exec -- playwright test --config=c106-playwright.config.ts
      - name: Keep screenshots private as workflow artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c106-private-visual-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
