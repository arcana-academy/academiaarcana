name: C90 isolated reader toolbar verification
on:
  push:
    branches:
      - work/aa360-c90-reader-toolbar-diagnostic-20261023
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: New reader toolbar regression only
        run: npm exec -- vitest run src/components/accessibility/ReadingToolbar.test.tsx
      - name: Targeted component lint
        run: npm exec -- eslint src/components/accessibility/AccessibilityPanel.tsx src/components/workspace/PageEditor.tsx src/components/accessibility/ReadingToolbar.test.tsx
      - name: Exact head TypeScript validation
        run: npm run typecheck
