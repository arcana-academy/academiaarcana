name: Academia Arcana Quality Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Canonical infrastructure guard
        run: node scripts/verify-canonical-infrastructure.cjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Start local Supabase for authenticated E2E
        run: |
          supabase start
          supabase db reset
          supabase migration up --local --include-all

      - name: Configure local authenticated E2E fixture
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase-e2e.env"
          set -a
          source "$RUNNER_TEMP/supabase-e2e.env"
          set +a

          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "${PUBLIC_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"

          E2E_EMAIL="qa-e2e-${GITHUB_RUN_ID}@example.test"
          E2E_SIGNUP_EMAIL="qa-signup-${GITHUB_RUN_ID}@example.test"
          E2E_PASSWORD="Aa9-$(openssl rand -hex 12)"

          export E2E_EMAIL E2E_SIGNUP_EMAIL E2E_PASSWORD

          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLIC_KEY"
            printf 'E2E_EMAIL=%s\n' "$E2E_EMAIL"
            printf 'E2E_SIGNUP_EMAIL=%s\n' "$E2E_SIGNUP_EMAIL"
            printf 'E2E_PASSWORD=%s\n' "$E2E_PASSWORD"
          } >> "$GITHUB_ENV"

          node <<'NODE'
          const { API_URL, SERVICE_ROLE_KEY, E2E_EMAIL, E2E_PASSWORD } = process.env;

          const response = await fetch(`${API_URL}/auth/v1/admin/users`, {
            method: "POST",
            headers: {
              apikey: SERVICE_ROLE_KEY,
              Authorization: `Bearer ${SERVICE_ROLE_KEY}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: E2E_EMAIL,
              password: E2E_PASSWORD,
              email_confirm: true,
            }),
          });

          if (!response.ok) {
            throw new Error(`Unable to create local E2E user: HTTP ${response.status}`);
          }
          NODE

          rm -f "$RUNNER_TEMP/supabase-e2e.env"

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop
