name: Academia Arcana Quality Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts

      - name: Verify supply-chain workflow boundary
        run: node scripts/verify-supply-chain-workflows.cjs

      - name: Verify dependency lifecycle allowlist
        run: node scripts/verify-dependency-lifecycle-scripts.cjs

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: npm rebuild esbuild unrs-resolver --ignore-scripts=false

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Canonical infrastructure guard
        run: node scripts/verify-canonical-infrastructure.cjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
        run: npm run build

      - name: Install Playwright browser
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
        run: npm run test:e2e

      - name: Verify production public configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-public-runtime-config.mjs

      - name: Build production image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://abcdefghijklmnopqrst.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC' }}
          ACADEMIA_ARCANA_REVISION: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg ACADEMIA_ARCANA_REVISION="$ACADEMIA_ARCANA_REVISION" \
            --tag "academiaarcana:$ACADEMIA_ARCANA_REVISION" .

      - name: Save production image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "academiaarcana:${GITHUB_SHA}" --output /tmp/academiaarcana-image.tar

      - name: Upload production image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-image-${{ github.sha }}
          path: /tmp/academiaarcana-image.tar
          if-no-files-found: error
          retention-days: 1
