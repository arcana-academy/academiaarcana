name: Academia Arcana Quality Gate

on:
  workflow_dispatch:

  # Branch PRs are validated by pull_request; running push on feat/chore
  # would duplicate the full Quality Gate for one HEAD. Preserve push for main:
  # image-release and production-smoke provenance depend on this event.
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    # Cycle 12 StatisticsView hashes require a stable Ubuntu major version.
    # Hosted runner image packages may still update; image metadata and visual
    # evidence must be reviewed before accepting any future baseline changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.19.1 --activate

      - name: Verify supply-chain workflow boundary
        run: node scripts/verify-supply-chain-workflows.cjs

      - name: Verify dependency lifecycle allowlist
        run: node scripts/verify-dependency-lifecycle-scripts.cjs

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: npm rebuild unrs-resolver --ignore-scripts=false

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Canonical infrastructure guard
        run: node scripts/verify-canonical-infrastructure.cjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
        run: npm run build

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
          STATISTICS_PILOT_CAPTURE_DIR: test-results/statistics-pilot-captures
        run: npm run test:e2e

      - name: Upload synthetic Cronograma visual review evidence
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cronograma-visual-review-${{ github.sha }}
          path: test-results/aa-cronograma-c43/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify production public configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-public-runtime-config.mjs

      - name: Build production image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://abcdefghijklmnopqrst.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://academiaarcana.onrender.com' }}
          NEXT_PUBLIC_ADOBE_FONTS_KIT_ID: ${{ vars.NEXT_PUBLIC_ADOBE_FONTS_KIT_ID }}
          NEXT_PUBLIC_HONEYBADGER_API_KEY: ${{ vars.NEXT_PUBLIC_HONEYBADGER_API_KEY }}
          NEXT_PUBLIC_HONEYBADGER_ASSETS_URL: ${{ vars.NEXT_PUBLIC_HONEYBADGER_ASSETS_URL }}
          ACADEMIA_ARCANA_REVISION: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_ADOBE_FONTS_KIT_ID="$NEXT_PUBLIC_ADOBE_FONTS_KIT_ID" \
            --build-arg NEXT_PUBLIC_HONEYBADGER_API_KEY="$NEXT_PUBLIC_HONEYBADGER_API_KEY" \
            --build-arg NEXT_PUBLIC_HONEYBADGER_ASSETS_URL="$NEXT_PUBLIC_HONEYBADGER_ASSETS_URL" \
            --build-arg ACADEMIA_ARCANA_REVISION="$ACADEMIA_ARCANA_REVISION" \
            --tag "academiaarcana:$ACADEMIA_ARCANA_REVISION" .

      - name: Smoke test isolated production image
        timeout-minutes: 3
        run: bash scripts/smoke-production-container.sh "${GITHUB_SHA}"

      - name: Save production image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "academiaarcana:${GITHUB_SHA}" --output /tmp/academiaarcana-image.tar

      - name: Upload production image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-image-${{ github.sha }}
          path: /tmp/academiaarcana-image.tar
          if-no-files-found: error
          retention-days: 30
