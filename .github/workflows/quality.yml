name: Academia Arcana Quality Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feat/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright test runner
        run: npm install --no-save --legacy-peer-deps @playwright/test@1.55.0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: End-to-end tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fichnalpbcfjywwhixid.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0yFN7N7ikHBDY6m6P3FICw_u1lL6ppI
        run: npx --yes playwright@1.55.0 test
