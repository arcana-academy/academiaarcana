name: C93 Non-destructive page templates proof
on:
  push:
    branches:
      - work/aa360-c93-page-templates-proof-20261023
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Only new pure template cases
        run: npm exec -- vitest run src/components/workspace/page-templates.test.ts
      - name: Only new editor integration cases
        run: npm exec -- vitest run src/components/workspace/PageEditor.test.tsx -t "applies an experiment starter|does not replace existing study notes"
      - name: Targeted lint
        run: npm exec -- eslint src/components/workspace/page-templates.ts src/components/workspace/page-templates.test.ts src/components/workspace/PageEditor.tsx src/components/workspace/PageEditor.test.tsx
      - name: Typecheck exact source head
        run: npm run typecheck
