name: Anti-Dark Pattern

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/anti-dark-pattern.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/anti-dark-pattern.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anti-dark-pattern-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Dark pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan front-end source
        uses: erayaha/anti-dark-pattern@316fbba6cfe59927b2d1d7a477c4795580c812ba # v1.0.0
        with:
          path: src
          format: github
