name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          audit_exit=$?
          echo "Development dependency audit exit: $audit_exit"
          echo "A non-zero result here is informational when all findings are dev-only and no supported remediation exists."
          exit 0
