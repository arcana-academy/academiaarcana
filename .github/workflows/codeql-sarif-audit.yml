name: SARIF Audit (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b0c80df9-academiaarcana

permissions:
  contents: read
  actions: read

concurrency:
  group: sarif-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis (SARIF artifact only)
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      - name: Print SARIF results to log
        run: |
          python3 - <<'PY'
          import glob, json
          for path in sorted(glob.glob("sarif-results/**/*.sarif", recursive=True)):
              data = json.load(open(path))
              for run in data.get("runs", []):
                  rules = {}
                  for r in run.get("tool", {}).get("driver", {}).get("rules", []):
                      rules[r["id"]] = r
                  results = run.get("results", [])
                  print(f"SARIF_FILE={path} TOTAL_RESULTS={len(results)}")
                  for res in results:
                      rid = res.get("ruleId", "?")
                      prec = res.get("level", rules.get(rid, {}).get("defaultConfiguration", {}).get("level", "?"))
                      msg = (res.get("message", {}).get("text", "") or "").replace("\n", " ")[:300]
                      for loc in res.get("locations", []):
                          phys = loc.get("physicalLocation", {})
                          art = phys.get("artifactLocation", {}).get("uri", "?")
                          line = phys.get("region", {}).get("startLine", "?")
                          text = f"ALERT|{rid}|level={prec}|suppressed={bool(res.get('suppressions'))}|{art}:{line}|{msg}"
                          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          esc_file = str(art).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
                          try:
                              esc_line = int(line)
                          except Exception:
                              esc_line = 1
                          print(f"::warning file={esc_file},line={esc_line},title={rid}::{esc}")
                          print(text)
          PY

  scorecard-cli:
    name: Scorecard CLI (local Pinned-Dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard CLI locally
        run: |
          set +e
          docker run --rm \
            --volume "$PWD:/repo" --workdir /repo \
            ghcr.io/ossf/scorecard:stable \
            --local=. --checks=Pinned-Dependencies \
            --format=sarif --show-details \
            > scorecard-local.sarif 2> scorecard-cli.err
          echo "docker/scorecard exit: $?"
          ls -l scorecard-local.sarif scorecard-cli.err || true
          python3 - <<'PY'
          import pathlib
          err = pathlib.Path("scorecard-cli.err").read_text(errors="replace") if pathlib.Path("scorecard-cli.err").exists() else ""
          head = (err.strip().splitlines() or ["<no stderr>"])[:6]
          for i, line in enumerate(head):
              esc = line[:280].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning file=results.sarif,line=1,title=CLIERR{i}::{esc}")
          sarif = pathlib.Path("scorecard-local.sarif")
          print(f"::warning file=results.sarif,line=1,title=CLIERRSIZE::sarif_bytes={sarif.stat().st_size if sarif.exists() else -1}")
          PY

      - name: Print Scorecard CLI results
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("scorecard-local.sarif"))
          for run in data.get("runs", []):
              results = run.get("results", [])
              texts = []
              for res in results:
                  rid = res.get("ruleId", "?")
                  msg = (res.get("message", {}).get("text", "") or "").replace("\n", " ")[:260]
                  for loc in res.get("locations", []) or [{}]:
                      phys = loc.get("physicalLocation", {}) if loc else {}
                      art = phys.get("artifactLocation", {}).get("uri", "-") if phys else "-"
                      line = phys.get("region", {}).get("startLine", "-") if phys else "-"
                      texts.append(f"ALERT|{rid}|{art}:{line}|{msg}")
              print(f"::warning file=results.sarif,line=1,title=TOTAL::SCORECARD_CLI TOTAL_RESULTS={len(results)}")
              for start in range(0, len(texts), 3):
                  chunk = " || ".join(texts[start:start + 3])
                  esc = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::warning file=results.sarif,line=1,title=BATCH{start // 3}::{esc}")
          PY

  scorecard:
    name: Scorecard SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Scorecard SARIF uploaded from main
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-results
          path: scorecard-artifact
          run-id: 40388032264
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print SARIF results to log
        run: |
          python3 - <<'PY'
          import glob, json, os
          found = glob.glob("scorecard-artifact/**/*.sarif", recursive=True)
          path = found[0] if found else "results.sarif"
          data = json.load(open(path))
          for run in data.get("runs", []):
              rules = {}
              for r in run.get("tool", {}).get("driver", {}).get("rules", []):
                  rules[r["id"]] = r
              results = run.get("results", [])
              tool = run.get("tool", {}).get("driver", {}).get("name", "?")
              print(f"SARIF_FILE={path} TOOL={tool} TOTAL_RESULTS={len(results)}")
              print(f"::warning file=results.sarif,line=1,title=TOTAL::SARIF_FILE={path} TOOL={tool} TOTAL_RESULTS={len(results)}")
              texts = []
              for res in results:
                  rid = res.get("ruleId", "?")
                  prec = res.get("level", rules.get(rid, {}).get("defaultConfiguration", {}).get("level", "?"))
                  msg = (res.get("message", {}).get("text", "") or "").replace("\n", " ")[:280]
                  for loc in res.get("locations", []) or [{}]:
                      phys = loc.get("physicalLocation", {}) if loc else {}
                      art = phys.get("artifactLocation", {}).get("uri", "-") if phys else "-"
                      line = phys.get("region", {}).get("startLine", "-") if phys else "-"
                      texts.append(f"ALERT|{rid}|level={prec}|{art}:{line}|{msg}")
              for start in range(0, len(texts), 3):
                  chunk = " || ".join(texts[start:start + 3])
                  esc = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::warning file=results.sarif,line=1,title=BATCH{start // 3}::{esc}")
                  print(chunk)
          PY
