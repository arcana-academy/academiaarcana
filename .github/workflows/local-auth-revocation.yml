name: Academia Arcana Local Auth Revocation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - work/aa360-c64-loopback-binding-qa-20261021
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-auth-revocation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-auth-revocation:
    name: Isolated two-account Auth and RLS exercise
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require isolated branch for C64 network QA
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/aa360-c64-loopback-binding-qa-20261021'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "arcana-academy/academiaarcana"
          test "$GITHUB_REF" = "refs/heads/work/aa360-c64-loopback-binding-qa-20261021"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/aa360-c64-loopback-binding-qa-20261021') && '6621977d477f65acc11f73e96697eb2e272bddec' || github.sha }}

      - name: Checkout dispatch-only harness in a temporary directory
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/aa360-c64-loopback-binding-qa-20261021'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .aa-dispatch-e2e-harness

      - name: Verify pinned candidate and stage ephemeral test harness
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/aa360-c64-loopback-binding-qa-20261021'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"
          # App checkout remains exactly the verified MVP commit.
          cp .aa-dispatch-e2e-harness/scripts/security/test-local-authenticated-nextjs-e2e.mjs scripts/security/test-local-authenticated-nextjs-e2e-dispatch.mjs
          cp .aa-dispatch-e2e-harness/scripts/security/local-supabase-https-proxy-dispatch.mjs scripts/security/local-supabase-https-proxy-dispatch.mjs
          git diff --quiet
          # Only the synthetic Playwright spec may be overlaid in this runner.
          cp .aa-dispatch-e2e-harness/tests/e2e/grimoires-workspace.spec.ts tests/e2e/grimoires-workspace.spec.ts
          rm -rf .aa-dispatch-e2e-harness
          test "$(git diff --name-only)" = "tests/e2e/grimoires-workspace.spec.ts"
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # C64: test-only bridge; default Supabase CLI host binds are all-interface.
      - name: Create loopback-only Docker network
        shell: bash
        run: |
          set -euo pipefail
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 aa-c64-loopback
          test "$(docker network inspect --format '{{ index .Options "com.docker.network.bridge.host_binding_ipv4" }}' aa-c64-loopback)" = "127.0.0.1"

      - name: Start ephemeral local Supabase
        run: supabase start --network-id aa-c64-loopback

      - name: Verify Supabase published host ports are loopback-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          const ids = execFileSync("docker", ["ps", "-q", "--filter", "name=supabase_"], { encoding: "utf8" })
            .trim().split(/\s+/).filter(Boolean);
          assert.ok(ids.length > 0, "No ephemeral Supabase containers found");
          let published = 0;
          for (const id of ids) {
            const [container] = JSON.parse(execFileSync("docker", ["inspect", id], { encoding: "utf8" }));
            assert.ok(Object.hasOwn(container.NetworkSettings.Networks ?? {}, "aa-c64-loopback"),
              "Supabase container not attached to isolated bridge: " + container.Name);
            for (const bindings of Object.values(container.NetworkSettings.Ports ?? {})) {
              for (const binding of bindings ?? []) {
                published += 1;
                assert.ok(["127.0.0.1", "::1"].includes(binding.HostIp),
                  "Non-loopback Supabase port: " + container.Name + " " + binding.HostIp + ":" + binding.HostPort);
              }
            }
          }
          assert.ok(published > 0, "No published host ports found; cannot validate isolation");
          console.log("PASS: " + published + " published Supabase host ports bind exclusively to loopback");
          NODE

      - name: Exercise two isolated identities and global session revocation
        if: github.ref != 'refs/heads/work/aa360-c64-loopback-binding-qa-20261021' # C64 branch checks network only; reuse C63 PASS
        run: node scripts/security/test-local-auth-revocation.mjs

      - name: Install browser for isolated authenticated Next.js E2E
        if: github.event_name == 'pull_request'
        run: npm exec -- playwright install --with-deps chromium

      - name: Run authenticated Next.js journeys against local-only Supabase
        if: github.event_name == 'pull_request'
        env:
          AA_LOCAL_SUPABASE_E2E: "1"
          AA_C54_SYNTHETIC_VISUAL: "1"
          AA_AUTH_DISPATCH_CANDIDATE_SHA: "6621977d477f65acc11f73e96697eb2e272bddec"
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/security/test-local-authenticated-nextjs-e2e-dispatch.mjs
          else
            node scripts/security/test-local-authenticated-nextjs-e2e.mjs
          fi

      - name: Archive synthetic local visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-c54-synthetic-visual
          path: artifacts/aa360-c54-visual/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Remove loopback-only Docker network
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker network inspect aa-c64-loopback >/dev/null 2>&1; then
            docker network rm aa-c64-loopback
          fi
