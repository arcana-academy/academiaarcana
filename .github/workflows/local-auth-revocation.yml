name: Academia Arcana Local Auth Revocation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-auth-revocation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-auth-revocation:
    name: Isolated two-account Auth and RLS exercise
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require isolated branch for manual authenticated QA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "arcana-academy/academiaarcana"
          test "$GITHUB_REF" = "refs/heads/work/aa360-c63-auth-e2e-c62-exact-sha-20261021"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && '6621977d477f65acc11f73e96697eb2e272bddec' || github.sha }}

      - name: Checkout dispatch-only harness in a temporary directory
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .aa-dispatch-e2e-harness

      - name: Verify pinned candidate and stage ephemeral test harness
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"
          # App checkout remains exactly the verified MVP commit.
          cp .aa-dispatch-e2e-harness/scripts/security/test-local-authenticated-nextjs-e2e.mjs scripts/security/test-local-authenticated-nextjs-e2e-dispatch.mjs
          cp .aa-dispatch-e2e-harness/scripts/security/local-supabase-https-proxy-dispatch.mjs scripts/security/local-supabase-https-proxy-dispatch.mjs
          git diff --quiet
          # Only the synthetic Playwright spec may be overlaid in this runner.
          cp .aa-dispatch-e2e-harness/tests/e2e/grimoires-workspace.spec.ts tests/e2e/grimoires-workspace.spec.ts
          rm -rf .aa-dispatch-e2e-harness
          test "$(git diff --name-only)" = "tests/e2e/grimoires-workspace.spec.ts"
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start ephemeral local Supabase
        run: supabase start

      - name: Exercise two isolated identities and global session revocation
        run: node scripts/security/test-local-auth-revocation.mjs

      - name: Install browser for isolated authenticated Next.js E2E
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: npm exec -- playwright install --with-deps chromium

      - name: Run authenticated Next.js journeys against local-only Supabase
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          AA_LOCAL_SUPABASE_E2E: "1"
          AA_C54_SYNTHETIC_VISUAL: "1"
          AA_AUTH_DISPATCH_CANDIDATE_SHA: "6621977d477f65acc11f73e96697eb2e272bddec"
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/security/test-local-authenticated-nextjs-e2e-dispatch.mjs
          else
            node scripts/security/test-local-authenticated-nextjs-e2e.mjs
          fi

      - name: Archive synthetic local visual evidence
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-c54-synthetic-visual
          path: artifacts/aa360-c54-visual/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
