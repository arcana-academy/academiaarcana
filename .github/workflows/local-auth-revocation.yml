# C64 QA-only variant, isolated from main and protected candidate branches.
name: Academia Arcana Local Auth Revocation
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c64-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-auth-revocation:
    name: C64 two-identity private Storage isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard GitHub identity and isolated dispatch branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "arcana-academy/academiaarcana"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/work/aa360-c64-local-storage-isolation-20261021"

      - name: Checkout exact protected C62 application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6621977d477f65acc11f73e96697eb2e272bddec

      - name: Checkout synthetic QA-only harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .aa-c64-harness

      - name: Validate app identity and stage only the local Storage test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"
          git diff --quiet
          git diff --cached --quiet
          test ! -e scripts/security/test-local-storage-isolation.mjs
          cp .aa-c64-harness/scripts/security/test-local-storage-isolation.mjs scripts/security/test-local-storage-isolation.mjs
          rm -rf .aa-c64-harness
          git diff --quiet
          git diff --cached --quiet
          test "$(git status --porcelain --untracked-files=all)" = "?? scripts/security/test-local-storage-isolation.mjs"
          test "$(git rev-parse HEAD)" = "6621977d477f65acc11f73e96697eb2e272bddec"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start disposable Supabase including Storage
        run: supabase start

      - name: Exercise only C64 private Storage operations
        env:
          AA_C64_LOCAL_STORAGE_QA: "1"
        run: node scripts/security/test-local-storage-isolation.mjs

      - name: Stop and destroy disposable Supabase
        if: always()
        run: supabase stop --no-backup
