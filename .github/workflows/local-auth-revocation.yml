name: Academia Arcana Local Auth Revocation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-auth-revocation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-auth-revocation:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/work/aa360-c64-storage-two-account-20261021'
    name: Isolated two-account Auth and RLS exercise
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start ephemeral local Supabase
        run: supabase start

      - name: Exercise two isolated identities and global session revocation
        run: node scripts/security/test-local-auth-revocation.mjs

      - name: Install browser for isolated authenticated Next.js E2E
        if: github.event_name == 'pull_request'
        run: npm exec -- playwright install --with-deps chromium

      - name: Run authenticated Next.js journeys against local-only Supabase
        if: github.event_name == 'pull_request'
        env:
          AA_LOCAL_SUPABASE_E2E: "1"
          AA_C54_SYNTHETIC_VISUAL: "1"
        run: node scripts/security/test-local-authenticated-nextjs-e2e.mjs

      - name: Archive synthetic local visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-c54-synthetic-visual
          path: artifacts/aa360-c54-visual/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup

  c64-storage:
    name: C64 Synthetic Storage isolation (exact SHA)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/aa360-c64-storage-two-account-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Require exact QA branch and repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "arcana-academy/academiaarcana"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/work/aa360-c64-storage-two-account-20261021"

      - name: Checkout immutable C62 application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6a7b1907dc5fc854ab4a5c758911a75c2e251305

      - name: Fetch C64-only test from exact QA workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .aa-c64-harness

      - name: Verify pinned candidate and stage test in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6a7b1907dc5fc854ab4a5c758911a75c2e251305"
          test "$GITHUB_SHA" = "$(git -C .aa-c64-harness rev-parse HEAD)"
          git diff --quiet
          cp .aa-c64-harness/scripts/security/test-local-storage-isolation-c64.mjs scripts/security/test-local-storage-isolation-c64.mjs
          rm -rf .aa-c64-harness
          test "$(git status --porcelain --untracked-files=all)" = "?? scripts/security/test-local-storage-isolation-c64.mjs"
          test "$(git rev-parse HEAD)" = "6a7b1907dc5fc854ab4a5c758911a75c2e251305"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start disposable local Supabase
        run: supabase start

      - name: Check only incremental cross-owner Storage cases
        run: node scripts/security/test-local-storage-isolation-c64.mjs

      - name: Stop and delete local Supabase
        if: always()
        run: supabase stop --no-backup
