name: Academia Arcana Image Release

on:
  workflow_run:
    workflows: ["Academia Arcana Quality Gate"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: image-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify trusted Quality Gate provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject manual, foreign, or rerun releases
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RESULT: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$UPSTREAM_EVENT" != "push" ] || [ "$UPSTREAM_BRANCH" != "main" ] ||
             [ "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ] ||
             [ "$UPSTREAM_ATTEMPT" != "1" ] || [ "$UPSTREAM_RESULT" != "success" ]; then
            echo "Image release requires an original successful push to main in this repository." >&2
            exit 1
          fi

  publish:
    name: Publish reviewed image to GHCR
    needs: preflight
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Reject stale main revision before publishing
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected release revision." >&2
            exit 1
          fi
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$current" != "$EXPECTED_REVISION" ]; then
            echo "Main advanced; refusing stale image publication." >&2
            exit 1
          fi

      - name: Download image built by the successful Quality Gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: academiaarcana-image-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/academiaarcana-image

      - name: Load and publish immutable and moving tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker load --input /tmp/academiaarcana-image/academiaarcana-image.tar
          docker tag "academiaarcana:${IMAGE_REVISION}" "ghcr.io/arcana-academy/academiaarcana:${IMAGE_REVISION}"
          docker tag "academiaarcana:${IMAGE_REVISION}" "ghcr.io/arcana-academy/academiaarcana:main"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/arcana-academy/academiaarcana:${IMAGE_REVISION}"
          docker push "ghcr.io/arcana-academy/academiaarcana:main"
          docker logout ghcr.io

  deploy:
    name: Request Render image deployment
    needs: publish
    if: ${{ vars.RENDER_IMAGE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Reject stale main revision before deployment
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected deployment revision." >&2
            exit 1
          fi
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$current" != "$EXPECTED_REVISION" ]; then
            echo "Main advanced; refusing stale deployment." >&2
            exit 1
          fi

      - name: Request deployment of the immutable image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render image deployment is enabled but its deploy hook secret is missing."
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/* ]]; then
            echo "Render deploy hook must use HTTPS on api.render.com." >&2
            exit 1
          fi
          curl --fail --silent --show-error --proto "=https" --max-redirs 0 --get \
            --data-urlencode "imgURL=ghcr.io/arcana-academy/academiaarcana:${IMAGE_REVISION}" \
            "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          printf '%s\n' "$IMAGE_REVISION" > /tmp/academiaarcana-deployed-revision.txt

      - name: Upload requested production revision for smoke verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-deploy-request
          path: /tmp/academiaarcana-deployed-revision.txt
          if-no-files-found: error
          retention-days: 1
