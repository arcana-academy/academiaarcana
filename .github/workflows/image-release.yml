name: Academia Arcana Image Release

on:
  workflow_run:
    workflows: ["Academia Arcana Quality Gate"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_revision:
        description: "Exact approved main SHA (40 lowercase hex characters)"
        required: true
        type: string
      quality_run_id:
        description: "Original successful push-to-main Quality Gate run ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify trusted Quality Gate provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      upstream_run_id: ${{ steps.provenance.outputs.upstream_run_id }}
    steps:
      - name: Verify trusted source for event or explicit promotion
        id: provenance
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RESULT: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REVISION: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_ID: ${{ github.event.workflow_run.id }}
          MANUAL_REVISION: ${{ inputs.approved_revision }}
          MANUAL_RUN_ID: ${{ inputs.quality_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "workflow_run" ]; then
            if [ "$UPSTREAM_EVENT" != "push" ] || [ "$UPSTREAM_BRANCH" != "main" ] ||
               [ "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ] ||
               [ "$UPSTREAM_ATTEMPT" != "1" ] || [ "$UPSTREAM_RESULT" != "success" ]; then
              echo "Image release requires an original successful push to main in this repository." >&2
              exit 1
            fi
            revision="$UPSTREAM_REVISION"
            run_id="$UPSTREAM_ID"
          elif [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            # Manual promotion requires independent approval recorded before
            # setting GHCR_PUBLISH_APPROVED_SHA; a dispatch alone is insufficient.
            if [ "$RELEASE_REF" != "refs/heads/main" ]; then
              echo "Manual image promotion must run from the trusted main workflow ref." >&2
              exit 1
            fi
            revision="$MANUAL_REVISION"
            run_id="$MANUAL_RUN_ID"
            if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid manually approved revision or original Quality Gate run ID." >&2
              exit 1
            fi
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if ! printf '%s' "$run_json" | jq -e \
                 --arg revision "$revision" \
                 --arg repository "$GITHUB_REPOSITORY" '
                   .name == "Academia Arcana Quality Gate" and
                   .event == "push" and
                   .head_branch == "main" and
                   .head_sha == $revision and
                   .head_repository.full_name == $repository and
                   .repository.full_name == $repository and
                   .run_attempt == 1 and
                   .status == "completed" and
                   .conclusion == "success"
                 ' >/dev/null; then
              echo "Manual promotion must reference the original successful official main Quality Gate." >&2
              exit 1
            fi
          else
            echo "Unsupported image release event." >&2
            exit 1
          fi
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unexpected or missing release provenance." >&2
            exit 1
          fi
          printf 'release_sha=%s\nupstream_run_id=%s\n' "$revision" "$run_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish reviewed image to GHCR
    needs: preflight
    outputs:
      image_url: ${{ steps.publish_image.outputs.image_url }}
    if: >-
      ${{
        vars.GHCR_PUBLISH_APPROVED_SHA != '' &&
        vars.GHCR_PUBLISH_APPROVED_SHA == needs.preflight.outputs.release_sha &&
        needs.preflight.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Reject stale main revision before publishing
        env:
          EXPECTED_REVISION: ${{ needs.preflight.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected release revision." >&2
            exit 1
          fi
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$current" != "$EXPECTED_REVISION" ]; then
            echo "Main advanced; refusing stale image publication." >&2
            exit 1
          fi

      - name: Download image built by the successful Quality Gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: academiaarcana-image-${{ needs.preflight.outputs.release_sha }}
          run-id: ${{ needs.preflight.outputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/academiaarcana-image

      - name: Publish uniquely tagged image and capture its immutable digest
        id: publish_image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REVISION: ${{ needs.preflight.outputs.release_sha }}
          UPSTREAM_RUN_ID: ${{ needs.preflight.outputs.upstream_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_REVISION" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid image provenance for publication." >&2
            exit 1
          fi
          image="ghcr.io/arcana-academy/academiaarcana"
          unique_tag="${image}:${IMAGE_REVISION}-run-${UPSTREAM_RUN_ID}"
          docker load --input /tmp/academiaarcana-image/academiaarcana-image.tar
          docker tag "academiaarcana:${IMAGE_REVISION}" "$unique_tag"
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$current" != "$IMAGE_REVISION" ]; then
            echo "Main advanced before publication; refusing stale image." >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          push_result="$(docker push "$unique_tag" 2>&1)"
          printf '%s\n' "$push_result"
          digest="$(printf '%s\n' "$push_result" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64})( |$).*$/\1/p' | tail -n1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GHCR did not return a verifiable image digest." >&2
            exit 1
          fi
          printf 'image_url=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  deploy:
    name: Request Render image deployment
    needs: [preflight, publish]
    if: >-
      ${{
        vars.RENDER_IMAGE_DEPLOY_ENABLED == 'true' &&
        vars.RENDER_DEPLOY_APPROVED_RUN_ID != '' &&
        vars.RENDER_DEPLOY_APPROVED_RUN_ID == format('{0}', github.run_id) &&
        github.run_attempt == 1 &&
        github.event_name == 'workflow_dispatch'
      }}
    environment:
      name: render-production-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Reject stale main revision before deployment
        env:
          EXPECTED_REVISION: ${{ needs.preflight.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected deployment revision." >&2
            exit 1
          fi
          current="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$current" != "$EXPECTED_REVISION" ]; then
            echo "Main advanced; refusing stale deployment." >&2
            exit 1
          fi

      - name: Request deployment of the immutable image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REVISION: ${{ needs.preflight.outputs.release_sha }}
          IMAGE_URL: ${{ needs.publish.outputs.image_url }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_URL" =~ ^ghcr\.io/arcana-academy/academiaarcana@sha256:[0-9a-f]{64}$ ]]; then
            echo "Deployment requires an immutable GHCR image digest." >&2
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render image deployment is enabled but its deploy hook secret is missing."
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/* ]]; then
            echo "Render deploy hook must use HTTPS on api.render.com." >&2
            exit 1
          fi
          curl --fail --silent --show-error --proto "=https" --max-redirs 0 --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          printf '%s\n' "$IMAGE_REVISION" > /tmp/academiaarcana-deployed-revision.txt

      - name: Upload requested production revision for smoke verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: academiaarcana-deploy-request
          path: /tmp/academiaarcana-deployed-revision.txt
          if-no-files-found: error
          retention-days: 1
