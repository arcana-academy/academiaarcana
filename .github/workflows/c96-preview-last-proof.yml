name: C96 exact-head focused preview final proof
on:
  push:
    branches:
      - work/aa360-c96-a11y-preview-final-proof-20261023
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Only previously blocked local preview test
        run: npm exec -- vitest run src/components/workspace/AccessiblePageReadingPreview.test.tsx -t "editor preview reads unsaved draft"
      - name: Targeted C96 lint
        run: npm exec -- eslint src/components/workspace/AccessiblePageReadingPreview.tsx src/components/workspace/AccessiblePageReadingPreview.test.tsx src/components/workspace/PageEditor.tsx
      - name: Exact feature HEAD typecheck
        run: npm run typecheck
