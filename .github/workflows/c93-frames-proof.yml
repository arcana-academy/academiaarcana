name: C93 Isolated grimoire frames proof
on:
  push:
    branches:
      - work/aa360-c93-frames-focused-20261023
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Three new frame tests only
        run: npm exec -- vitest run src/components/workspace/PageFrameStyleView.test.tsx
      - name: Targeted lint
        run: npm exec -- eslint src/components/workspace/PageFrameStyleView.tsx src/components/workspace/PageFrameStyleView.test.tsx src/components/workspace/Workspace.tsx
      - name: Typecheck exact feature HEAD
        run: npm run typecheck
