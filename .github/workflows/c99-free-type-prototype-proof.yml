name: C99 isolated free-type prototype collision proof
on:
  push:
    branches:
      - work/aa360-c99-free-type-prototype-proof-20261023
permissions:
  contents: read
jobs:
  free-type-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: eadc55bcb145220e5b4201f0e0fca0d17da56f31
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Only newly added prototype-key regression
        run: npm exec -- vitest run src/components/workspace/AccessibleBlockContractsC99.test.tsx -t "free-type names colliding with Object.prototype"
      - name: Lint only changed files
        run: npm exec -- eslint src/components/workspace/accessible-block-contract.ts src/components/workspace/AccessibleBlockContractsC99.test.tsx
      - name: Verify corrected TypeScript source
        run: npm run typecheck
