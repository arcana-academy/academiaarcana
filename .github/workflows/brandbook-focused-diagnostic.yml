name: Brand Book isolated focused verification
on:
  push:
    branches:
      - "work/aa360-brandbook-pr774-diagnostic-20261022"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Focused new regression tests only
        run: npm exec -- vitest run src/components/workspace/PageEditor.test.tsx
      - name: Typecheck new head
        run: npm run typecheck
