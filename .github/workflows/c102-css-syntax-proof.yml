name: C102 isolated stylesheet parse
on:
  push:
    branches:
      - work/aa360-c102-css-parse-isolated-20261023
permissions:
  contents: read
jobs:
  css-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b523dbd0eb2c608ca81c2aa6980c48969c2862eb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Only unverified C102 stylesheet parse
        run: node -e "const fs=require('node:fs'); const postcss=require('postcss'); const file='src/app/arcana-visual-approved.css'; const root=postcss.parse(fs.readFileSync(file,'utf8'),{from:file}); console.log('CSS parsed; rules:',root.nodes.length)"
