name: C97 browser-only synthetic TXT download
on:
  push:
    branches:
      - work/aa360-c97-real-browser-export-20261023
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild unrs-resolver --ignore-scripts=false
      - name: Build synthetic non-production fixture
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
      - name: Only new C97 real-browser local file export
        run: npm exec -- playwright test --config=tests/c97.config.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AAAAAAAAAA_BBBBBBBBBBB_CCCCCCCC
