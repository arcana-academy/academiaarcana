name: Academia Arcana Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check production alias
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://academiaarcana.vercel.app"

          for attempt in {1..12}; do
            status="$(curl -sS -o /tmp/production.html -w "%{http_code}" --max-time 20 "${base_url}/")"
            if [ "$status" = "200" ] && grep -qi "Academia Arcana" /tmp/production.html; then
              echo "Production root is healthy."
              exit 0
            fi

            echo "Production root not ready (attempt $attempt, HTTP $status); retrying..."
            sleep 10
          done

          echo "Production root smoke check failed."
          exit 1

      - name: Check public runtime routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://academiaarcana.vercel.app"

          for path in /login /cadastro /recuperar-senha /integracoes; do
            status="$(curl -sS -o /tmp/route.html -w "%{http_code}" --max-time 20 "${base_url}${path}")"
            if [ "$status" != "200" ]; then
              echo "Route $path returned HTTP $status."
              exit 1
            fi
          done

          echo "Public production routes are healthy."

      - name: Check integration status contract
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://academiaarcana.vercel.app"

          curl -fsS --max-time 20 "${base_url}/api/integrations/status" -o /tmp/integration-status.json

          node <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/integration-status.json", "utf8"));

          if (!Number.isInteger(body.catalogSize) || body.catalogSize < 1) {
            throw new Error("Invalid catalogSize: " + body.catalogSize);
          }

          if (body.connectedCount !== 1 || body.errorCount !== 0) {
            throw new Error(
              `Unexpected integration counts: connected=${body.connectedCount}, error=${body.errorCount}`,
            );
          }

          const github = body.entries?.find((entry) => entry.name === "GitHub");
          if (
            github?.status !== "connected" ||
            github?.verification?.repository !== "arcana-academy/academiaarcana"
          ) {
            throw new Error("GitHub runtime verification contract failed.");
          }

          const dictionary = body.entries?.find(
            (entry) => entry.name === "A-Z Dictionary",
          );
          if (
            dictionary?.status !== "catalogued" ||
            dictionary?.chatgptAppUrl !==
              "https://chatgpt.com/plugins/plugin_asdk_app_6960e92ebfa481918f4ccff0c8b219db" ||
            dictionary?.verification !== null
          ) {
            throw new Error("A-Z Dictionary bridge contract failed.");
          }

          const spotify = body.entries?.find(
            (entry) => entry.name === "Spotify",
          );
          if (
            spotify?.status !== "catalogued" ||
            spotify?.chatgptAppUrl !==
              "https://chatgpt.com/plugins/plugin_asdk_app_68de829bf7648191acd70a907364c67c" ||
            spotify?.verification !== null
          ) {
            throw new Error("Spotify bridge contract failed.");
          }

          const tarot = body.entries.find(
            (entry) => entry.name === "Tarot",
          );
          if (
            tarot.status !== "catalogued" ||
            tarot.executionMode !== "catalog-only" ||
            tarot.chatgptAppUrl !==
              "https://chatgpt.com/plugins/plugin_asdk_app_6943a2c078b0819188de39e4fe168d9b" ||
            tarot.verification !== null
          ) {
            throw new Error("Tarot bridge contract failed.");
          }

          const bridgedEntries = body.entries.filter(
            (entry) => typeof entry.chatgptAppUrl === "string",
          );
          if (bridgedEntries.some(
            (entry) =>
              !entry.chatgptAppUrl.startsWith("https://chatgpt.com/") ||
              entry.status !== "catalogued" ||
              entry.verification !== null,
          )) {
            throw new Error("ChatGPT bridge security contract failed.");
          }

          console.log("Production integration status contract is healthy.");
          NODE
