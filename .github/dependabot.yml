version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "typescript"
        versions:
          - "7.x"

    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

    ignore:
      # A política de runtime do repositório é Node.js 24.x (package.json
      # engines/devEngines, .nvmrc, devcontainer e Dockerfile). Major bumps da
      # base (ex.: node 25-bookworm-slim, PR #813) devem ser decisão manual e
      # coordenada com os gates canônicos; Dependabot mantém apenas minor/patch.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
